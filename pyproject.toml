[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "conflux-state"
version = "0.9.1"
description = "Deterministic, conflict-aware CRDT shared state protocol for concurrent AI agents, with MCP server and drop-in adapters for LangGraph, CrewAI, and AutoGen."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Conflux Maintainers" }
]
keywords = [
    "multi-agent",
    "ai-agents",
    "mcp",
    "model-context-protocol",
    "crdt",
    "distributed-systems",
    "shared-state",
    "langgraph",
    "crewai",
    "autogen",
    "lattice",
    "state-management",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/lolllll212/Conflux"
Repository = "https://github.com/lolllll212/Conflux"
Documentation = "https://github.com/lolllll212/Conflux#readme"
Issues = "https://github.com/lolllll212/Conflux/issues"

[project.scripts]
conflux-server = "conflux.server:main"
conflux-mcp = "conflux.mcp:main"

[project.optional-dependencies]
crypto = ["cryptography>=3.4"]
langgraph = ["langgraph>=0.2.0"]
crewai = ["crewai>=0.80.0"]
autogen = ["autogen-agentchat>=0.4.0", "autogen-core>=0.4.0"]
integrations = [
    "langgraph>=0.2.0",
    "crewai>=0.80.0",
    "autogen-agentchat>=0.4.0",
    "autogen-core>=0.4.0",
]
test = ["pytest", "cryptography>=3.4"]

[tool.setuptools]
packages = ["conflux", "conflux.integrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
